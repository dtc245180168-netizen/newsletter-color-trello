<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Phối Màu Cho Newsletter (Trello Sample)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1E293B;
        }
        .hub-header {
            background: #0F172A;
            color: #FFFFFF;
            padding: 30px 20px;
            margin-bottom: 30px;
            border-bottom: 3px solid #2563EB;
        }
        .nav-pills .nav-link {
            font-weight: 600;
            color: #64748B;
            border-radius: 8px;
            padding: 10px 20px;
        }
        .nav-pills .nav-link.active {
            background-color: #2563EB;
            color: #FFFFFF;
        }
        .preview-frame {
            width: 100%;
            height: 850px;
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            background: #FFFFFF;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .palette-chip {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: inline-block;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.1);
            margin-right: 4px;
        }
    </style>
</head>
<body>
    
    <header class="hub-header text-center">
        <div class="container">
            <h1 class="h3 fw-bold mb-2">🎯 [Bài Tập] Phối Màu Cho Newsletter (Trello)</h1>
            <p class="text-white-50 mb-0">Thực hành lựa chọn bộ màu hài hòa trên Adobe Color và ứng dụng vào giao diện Newsletter Bootstrap</p>
        </div>
    </header>

    <div class="container pb-5">
        
        <!-- Controls & Links -->
        <div class="card p-3 mb-4 border-0 shadow-sm">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <ul class="nav nav-pills" id="paletteTabs">
                    <li class="nav-item">
                        <button class="nav-link active" onclick="loadFrame('newsletter_version1.html', this)">
                            <span class="palette-chip" style="background:#0079BF;"></span>
                            <span class="palette-chip" style="background:#FF7A00;"></span>
                            Phiên Bản 1: Ocean Blue & Coral (Năng Suất)
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" onclick="loadFrame('newsletter_version2.html', this)">
                            <span class="palette-chip" style="background:#7B2CBF;"></span>
                            <span class="palette-chip" style="background:#FF9E00;"></span>
                            Phiên Bản 2: Royal Purple & Amber (Sáng Tạo)
                        </button>
                    </li>
                </ul>

                <div class="d-flex gap-2">
                    <a href="newsletter_version1.html" target="_blank" class="btn btn-outline-primary btn-sm">Mở Bản 1 Độc Lập ↗</a>
                    <a href="newsletter_version2.html" target="_blank" class="btn btn-outline-purple btn-sm" style="color:#7B2CBF;border-color:#7B2CBF;">Mở Bản 2 Độc Lập ↗</a>
                </div>
            </div>
        </div>

        <!-- Live View Frame -->
        <iframe id="viewFrame" class="preview-frame" src="newsletter_version1.html"></iframe>

    </div>

    <script>
        function loadFrame(url, btn) {
            document.getElementById('viewFrame').src = url;
            document.querySelectorAll('#paletteTabs .nav-link').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
